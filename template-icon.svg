<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Apache Pulsar">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0b1220"/>
  <!-- radial pulse rings (wavefronts emitted from the core) -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.28"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#ring)" stroke-width="9" opacity="0.5"/>
  <circle cx="128" cy="128" r="46" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.75"/>
  <!-- radiant pulse core -->
  <circle cx="128" cy="128" r="30" fill="url(#core)"/>
  <circle cx="128" cy="128" r="15" fill="#e0f7ff"/>
  <!-- outward stream ticks (data propagation) -->
  <rect x="120" y="20"  width="16" height="26" rx="8" fill="url(#core)" opacity="0.9"/>
  <rect x="120" y="210" width="16" height="26" rx="8" fill="url(#core)" opacity="0.9"/>
  <rect x="18"  y="120" width="26" height="16" rx="8" fill="url(#core)" opacity="0.9"/>
  <rect x="212" y="120" width="26" height="16" rx="8" fill="url(#core)" opacity="0.9"/>
</svg>
